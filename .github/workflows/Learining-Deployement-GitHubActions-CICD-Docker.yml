

name: Build and Deploy NodeApp Container to Azure

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env: 
  ACR_LOGIN_SERVER: darshanchauhan089registry.azurecr.io
  IMAGE_NAME: my-express-app

jobs: 
  build-and-push:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with: 
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with: 
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy: 
    runs-on: ubuntu-latest
    needs: build-and-push

    environment: 
      name: Development
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps: 
      - name: Deploy container to Azure App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with: 
          app-name: Learining-Deploy-GitHubActions-CICD-Docker
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  